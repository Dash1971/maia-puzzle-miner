[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "maia-puzzle-miner"
version = "0.1.0"
description = "Mine Lichess puzzles whose objectively correct move is unlikely for humans at a chosen rating."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "python-chess>=1.999,<2",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
maia3 = [
  "maia3 @ git+https://github.com/CSSLab/maia3.git@1e13597c42d4858b7cfd7cfdae01e297263364b2",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "ruff>=0.14,<1",
]

[project.scripts]
maia-puzzle-miner = "maia_puzzle_miner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/maia_puzzle_miner"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
